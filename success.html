<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TSBGMI Registration Complete</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#070a10;
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:500px;
}

.card{
  background:#111722;
  border:1px solid #273246;
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
}

.logo{
  color:#00eaff;
  font-size:36px;
  font-weight:900;
  letter-spacing:2px;
}

.icon{
  width:80px;
  height:80px;
  margin:25px auto 18px;
  border-radius:50%;
  background:#063b2a;
  border:2px solid #00d9a5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
}

h1{
  font-size:24px;
  margin-bottom:10px;
}

.subtitle{
  color:#9ca3af;
  line-height:1.5;
  font-size:14px;
}

.goodluck{
  margin-top:22px;
  padding:18px;
  background:#0b1018;
  border:1px solid #273246;
  border-radius:12px;
}

.goodluck h2{
  color:#00eaff;
  font-size:20px;
  margin-bottom:8px;
}

.goodluck p{
  color:#dbe4ef;
  line-height:1.5;
}

.instagram{
  display:inline-block;
  margin-top:20px;
  color:#00eaff;
  text-decoration:none;
  font-weight:bold;
}

.home{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#00d9ef;
  color:#061016;
  font-size:15px;
  font-weight:bold;
}

.footer{
  color:#667085;
  font-size:12px;
  margin-top:22px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      TSBGMI
    </div>

    <div class="icon">
      ✓
    </div>

    <h1>
      REGISTRATION COMPLETED
    </h1>

    <p class="subtitle">
      Your registration details have been successfully
      submitted to TSBGMI Esports.
    </p>


    <div class="goodluck">

      <h2>
        🎮 Good Luck!
      </h2>

      <p>
        Get ready for the match, play fair,
        follow the tournament rules and give
        your best performance. 🏆🔥
      </p>

    </div>


    <a
      class="instagram"
      href="https://instagram.com/tsbgmiesports"
      target="_blank">

      Follow @tsbgmiesports

    </a>


    <button
      class="home"
      onclick="goHome()">

      BACK TO RULES

    </button>


    <div class="footer">
      © 2026 TSBGMI Esports
    </div>

  </div>

</div>


<script>

function goHome(){

  window.location.href =
    "rules.html";

}

</script>

</body>
</html>
