<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TSBGMI Confirmation</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#070a10;
  color:#fff;
  min-height:100vh;
  padding:20px 14px;
}

.container{
  max-width:560px;
  margin:auto;
}

.header{
  text-align:center;
  padding:15px 0 25px;
}

.logo{
  color:#00eaff;
  font-size:36px;
  font-weight:900;
}

.header h1{
  font-size:21px;
  margin-top:8px;
}

.header p{
  color:#9ca3af;
  font-size:13px;
  margin-top:7px;
}

.instagram{
  display:inline-block;
  margin-top:12px;
  color:#00eaff;
  text-decoration:none;
  font-weight:bold;
}

.card{
  background:#111722;
  border:1px solid #273246;
  border-radius:18px;
  padding:20px;
}

.qr{
  text-align:center;
  margin:15px 0;
}

.qr img{
  width:240px;
  max-width:100%;
  background:#fff;
  padding:8px;
  border-radius:14px;
}

.fee{
  display:flex;
  justify-content:space-between;
  background:#0b1018;
  border:1px solid #273246;
  padding:14px;
  border-radius:10px;
  margin-top:10px;
}

.amount{
  color:#00eaff;
  font-weight:bold;
}

label{
  display:block;
  color:#cbd5e1;
  font-size:13px;
  margin:16px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #303b4d;
  background:#090e16;
  color:#fff;
  outline:none;
}

button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:11px;
  background:#00d9ef;
  color:#061016;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.note{
  color:#8d98a8;
  font-size:12px;
  line-height:1.5;
  text-align:center;
  margin-top:12px;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
}

.success{
  display:block;
  background:#063b2a;
  color:#7fffd4;
}

.error{
  display:block;
  background:#451b1b;
  color:#ff9b9b;
}
</style>
</head>

<body>

<div class="container">

<div class="header">

  <div class="logo">TSBGMI</div>

  <h1>CONFIRMATION</h1>

  <p>BGMI ESPORTS TOURNAMENT</p>

  <a
    class="instagram"
    href="https://instagram.com/tsbgmiesports"
    target="_blank">
    @tsbgmiesports
  </a>

</div>


<div class="card">

  <h2>💰 Registration Fee</h2>

  <div class="fee">
    <span>👥 Team</span>
    <span class="amount">₹90</span>
  </div>

  <div class="fee">
    <span>👤 Solo</span>
    <span class="amount">₹20</span>
  </div>


  <div class="qr">

    <img
      src="payment-qr.png"
      alt="TSBGMI QR">

  </div>


  <label>
    Enter UTR Number
  </label>

  <input
    id="reference"
    type="text"
    placeholder="Enter UTR number"
    maxlength="20">


  <label>
    WhatsApp Number
  </label>

  <input
    id="phone"
    type="tel"
    inputmode="numeric"
    placeholder="Enter 10 digit WhatsApp number"
    maxlength="10">


  <button
    id="submitBtn"
    onclick="submitConfirmation()">

    SUBMIT

  </button>


  <div
    id="message"
    class="message">
  </div>


  <p class="note">
    Your confirmation details will be sent to the
    tournament administrator for manual handling.
  </p>

</div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getDatabase,
  ref,
  push,
  set
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyDGu444d8XJQ27cZzh3rIYH3RtaJk3W0SM",

  authDomain:
  "tabgmi.firebaseapp.com",

  databaseURL:
  "https://tabgmi-default-rtdb.firebaseio.com",

  projectId:
  "tabgmi",

  storageBucket:
  "tabgmi.firebasestorage.app",

  messagingSenderId:
  "152073037485",

  appId:
  "1:152073037485:web:2172a74775e097eacb0824",

  measurementId:
  "G-22MSXBXJZD"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);


/* =========================
   SUBMIT
========================= */

window.submitConfirmation =
async function(){

  const reference =
    document
      .getElementById("reference")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const message =
    document
      .getElementById("message");


  const button =
    document
      .getElementById("submitBtn");


  message.className =
    "message";


  message.textContent = "";


  if(!reference){

    message.className =
      "message error";

    message.textContent =
      "❌ Enter your UTR number.";

    return;

  }


  if(!/^[0-9]{10}$/.test(phone)){

    message.className =
      "message error";

    message.textContent =
      "❌ Enter a valid 10 digit WhatsApp number.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "SUBMITTING...";


  try{

    const confirmationRef =
      ref(
        db,
        "paymentConfirmations"
      );


    const newConfirmation =
      push(confirmationRef);


    const data = {

      testReference:
        reference,

      whatsapp:
        phone,

      status:
        "Pending",

      submittedAt:
        new Date().toISOString()

    };


    await set(
      newConfirmation,
      data
    );


    message.className =
      "message success";

    message.textContent =
      "✅ Details submitted successfully!";


    setTimeout(function(){

      window.location.href =
        "success.html";

    },1500);


  }catch(error){

    console.error(error);

    message.className =
      "message error";

    message.textContent =
      "❌ Submission failed. Check Firebase.";

    button.disabled = false;

    button.textContent =
      "SUBMIT";

  }

};

</script>

</body>
</html>
